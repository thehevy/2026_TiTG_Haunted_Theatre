name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Shared sketch copies match their source
        shell: powershell
        run: .\tools\arduino\arduino.ps1 sync -Check

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Arduino15
            ~\Documents\Arduino\libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('tools/arduino/sketches.json') }}

      - name: Install cores and libraries
        shell: powershell
        run: |
          arduino-cli config init --overwrite
          .\tools\arduino\arduino.ps1 setup -Proxy ''

      - name: Compile all sketches
        shell: powershell
        run: .\tools\arduino\arduino.ps1 compile all

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central-controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: central-controller/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q tests

      - name: Shell scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
